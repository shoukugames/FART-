name: Windows build

# Builds the Windows .exe on GitHub's Windows machines (no Wine needed).
#   - every push to main: the .exe is kept as a download on the run's page for 30 days
#   - a tag such as v1.2.3: the .exe is also attached to that GitHub release
#   - or start it by hand: Actions -> Windows build -> Run workflow
# The .exe is not code-signed: building on GitHub doesn't sign it, so Windows SmartScreen can
# still warn about it until a code-signing certificate is added.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          python -m pip install "pygame-ce>=2.5" pyinstaller==6.20.0
      - name: Build
        run: |
          ROOT="$(cygpath -m "$PWD")"
          VERSION="$(python -c 'import digestion_lab; print(digestion_lab.__version__)')"
          SDL_VIDEODRIVER=dummy python packaging/make_icons.py
          python packaging/make_version_file.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "DigestionLab-v$VERSION" \
            --version-file "$ROOT/.build/version_info.txt" --icon "$ROOT/.build/icons/icon.ico" --paths "$ROOT" \
            --add-data "$ROOT/digestion_lab/sounds;digestion_lab/sounds" \
            --add-data "$ROOT/digestion_lab/music;digestion_lab/music" \
            --distpath dist/windows --workpath .build/pyi-win --specpath .build packaging/run.py
      - name: Show what was built
        run: |
          for f in dist/windows/DigestionLab-v*.exe; do
            echo "::notice title=Built $(basename "$f")::$(du -h "$f" | cut -f1), sha256 $(sha256sum "$f" | cut -d' ' -f1)"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: FART-windows
          path: |
            dist/windows/DigestionLab-v*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Windows build from GitHub Actions (not code-signed)."
          gh release upload "$GITHUB_REF_NAME" dist/windows/DigestionLab-v*.exe --clobber
